<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Afterimage</title>
  <defs>
    <radialGradient id="room" cx="42%" cy="36%" r="78%">
      <stop offset="0" stop-color="#4a1d1a"/>
      <stop offset=".55" stop-color="#24150f"/>
      <stop offset="1" stop-color="#130d0a"/>
    </radialGradient>
    <radialGradient id="echo" cx="50%" cy="50%" r="50%">
      <stop offset=".55" stop-color="#b4664a" stop-opacity="0"/>
      <stop offset=".84" stop-color="#d4794f" stop-opacity=".85"/>
      <stop offset="1" stop-color="#7a2e2e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="echoFill" cx="45%" cy="40%" r="60%">
      <stop offset="0" stop-color="#a03a2c" stop-opacity=".7"/>
      <stop offset="1" stop-color="#7a2e2e" stop-opacity=".12"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf3e2"/>
      <stop offset=".5" stop-color="#e7d3b0"/>
      <stop offset="1" stop-color="#a8865a"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e2bf"/>
      <stop offset=".62" stop-color="#e9a86e"/>
      <stop offset="1" stop-color="#b4664a"/>
    </linearGradient>
    <radialGradient id="blade" cx="232" cy="238" r="126" gradientUnits="userSpaceOnUse">
